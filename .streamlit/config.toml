[server]
address = "127.0.0.1"
port = 8501
headless = true
enableStaticServing = true  # app/static/fonts: Inter served by the app itself, no font service

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"

[client]
toolbarMode = "viewer"

# The portfolio look of Data-Generator; the same values live in src/pricing_engine/theme.py (tests/test_theme.py).
[theme]
base = "light"
primaryColor = "#006e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f7"
textColor = "#14232a"
linkColor = "#006e79"
borderColor = "#e5e9ea"
dataframeBorderColor = "#e5e9ea"
dataframeHeaderBackgroundColor = "#ffffff"
dataframeHeaderTextColor = "#808b90"
font = "Inter, 'Segoe UI', system-ui, sans-serif"
headingFont = "Inter, 'Segoe UI', system-ui, sans-serif"
headingFontWeights = 700
metricValueFontWeight = 500
baseRadius = "4px"
chartCategoricalColors = ["#006e79", "#c7692c", "#c3d5d8", "#59aab4", "#f0ac86", "#00434b", "#88461c"]

[theme.sidebar]
backgroundColor = "#f5f7f7"
secondaryBackgroundColor = "#ffffff"

# Inter (SIL Open Font License, app/static/fonts/OFL-inter.txt). The digits face comes last so it wins for 0-9:
# Inter's tabular digits, also in the canvas-drawn table and charts (scripts/inter_font.py).
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-ext-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-digits-tnum-wght-normal.woff2"
weight = "100 900"
style = "normal"
unicodeRange = "U+0030-0039"
